name: sanity_api
description: >-
  Pure Dart client for the Sanity.io Content Lake API. Run GROQ queries, create
  and patch documents, commit transactions and upload assets, from Dart servers,
  CLIs and Flutter apps alike. No Flutter dependency.
version: 0.1.0
repository: https://github.com/Fullphysio/sanity_api
issue_tracker: https://github.com/Fullphysio/sanity_api/issues

topics:
  - sanity
  - cms
  - groq
  - client

environment:
  sdk: ^3.6.0

dependencies:
  http: ^1.6.0
  meta: ^1.16.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
